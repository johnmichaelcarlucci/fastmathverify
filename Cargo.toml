[package]
name = "fastmathverify"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust rewrite of Hugging Face Math-Verify: thread-safe, hang-free math answer verification"

[lib]
name = "fastmathverify"
crate-type = ["cdylib", "rlib"]

[dependencies]
antlr4rust = "0.6"
fancy-regex = "0.14"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
pyo3 = { version = "0.27", features = ["abi3-py310"], optional = true }

[features]
default = []
python = ["pyo3", "pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
