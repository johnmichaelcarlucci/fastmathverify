[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fastmathverify"
version = "0.1.0"
description = "Rust rewrite of Hugging Face Math-Verify: same API, thread-safe, hang-free, much faster"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["math", "verification", "evaluation", "reinforcement-learning", "llm", "reward"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest", "sympy"]

[tool.maturin]
python-source = "python"
module-name = "fastmathverify._core"
features = ["python"]
